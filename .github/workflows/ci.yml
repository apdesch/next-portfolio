# Checks every pull request (and every push to main) the same way as before a commit
# locally. Vercel handles deploys; this only verifies.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The build prerenders public pages from the database, so it reads a Neon branch made
      # for CI (a copy of production). GitHub doesn't pass secrets to pull requests from forks.
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      # CI never serves requests; a local address keeps Better Auth from warning on every page.
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      # Actions are pinned to exact commits (with their release in a comment), so a moved
      # tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version in package.json's "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build loads the auth config, which needs a secret; CI never serves requests, so a
      # throwaway one per run is enough.
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm format:check
      - run: pnpm build
